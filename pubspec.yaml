name: is_journal
description: >-
  An add-only journal of bytes: each entry added before the bytes are acted
  on, chained to the one before, and naming the hash of the code that wrote
  it.
version: 0.1.0
repository: https://github.com/intersyntactic/journal

environment:
  sdk: ^3.13.0

dependencies:
  is_content_id: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
